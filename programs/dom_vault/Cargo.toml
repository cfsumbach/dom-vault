[package]
name = "dom_vault"
version = "0.1.0"
description = "Cofre tokenizado DOM — programa Anchor e transfer hook"
authors = ["Carlos F Sumbach <carlos@depthofmarket.com.br>"]
repository = "https://github.com/cfsumbach/dom-vault"
license = "UNLICENSED"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "dom_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.1.2", features = ["token_2022"] }
spl-transfer-hook-interface = "2.1.0"
spl-tlv-account-resolution = "0.11.1"
spl-discriminator = "0.5"
solana-instructions-sysvar = "3"
# Exigido pelo `zero_copy` da fila de resgates — o macro do Anchor emite
# caminhos `bytemuck::` e precisa do crate como dependência direta.
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
solana-security-txt = "1.1.3"

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
spl-token-2022-interface = "2.1.0"
solana-transaction-error = "3.0.0"
base64 = "0.22"
serde_json = "1"
sha2 = "0.10"
solana-instructions-sysvar = "3"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
